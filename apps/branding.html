<script>
// Datos del taller dentro de la app: pantalla de configuración (primera vez y
// después desde el botón "Datos del taller"), y aplicación del nombre y logo.
// Funciona igual en PC, iPhone y Android. No hace falta instalar nada.
(function () {
  var CAMPOS = [
    ['nombre', 'Nombre del taller', 'text'],
    ['eslogan', 'Frase debajo del nombre', 'text'],
    ['ciudad', 'Ciudad', 'text'],
    ['ciudadProvincia', 'Ciudad y provincia', 'text'],
    ['direccion', 'Dirección', 'text'],
    ['telefono', 'Teléfono', 'tel'],
    ['telefono2', 'Teléfono 2 (opcional)', 'tel'],
    ['email', 'Email', 'email'],
    ['web', 'Web (opcional)', 'text']
  ];

  function reemplazar(texto, pares) {
    for (var i = 0; i < pares.length; i++) texto = texto.split(pares[i][0]).join(pares[i][1]);
    return texto;
  }

  // Usa el logo del taller como ícono de la pestaña y de la pantalla de inicio (iPhone/Android).
  function ponerIconos(url) {
    if (!url) return;
    ['icon', 'apple-touch-icon'].forEach(function (rel) {
      var l = document.querySelector('link[rel="' + rel + '"]');
      if (!l) {
        l = document.createElement('link');
        l.rel = rel;
        document.head.appendChild(l);
      }
      l.href = url;
      if (rel === 'icon') l.type = 'image/png';
    });
  }

  function aplicar(cfg) {
    var n = String(cfg.nombre || '').trim();
    var pares = [
      ['Calle 123, Mi Ciudad, Mi Provincia', cfg.direccion || ''],
      ['Mi Ciudad, Mi Provincia', cfg.ciudadProvincia || ''],
      ['Mi Ciudad', cfg.ciudad || ''],
      ['mitaller@ejemplo.com', cfg.email || ''],
      ['Concesionario Oficial · Post Venta', cfg.eslogan || ''],
      ['MI TALLER', n.toUpperCase()],
      ['Mi Taller', n]
    ];
    window.TALLER_NOMBRE = n;
    document.title = reemplazar(document.title, pares);
    document.querySelectorAll('meta[name="apple-mobile-web-app-title"]').forEach(function (m) {
      m.content = reemplazar(m.content, pares);
    });
    // Logo en el menú lateral (si la página no tiene menú, arriba de todo).
    if (cfg.logoUrl && !document.querySelector('img.logo-app')) {
      var menu = document.querySelector('.tab-btn');
      var caja = menu && menu.parentNode ? menu.parentNode : document.body;
      var nuevoLogo = document.createElement('img');
      nuevoLogo.className = 'logo-app';
      nuevoLogo.alt = 'Logo del taller';
      nuevoLogo.style.cssText = 'display:block;max-width:150px;max-height:70px;margin:10px auto;object-fit:contain';
      caja.insertBefore(nuevoLogo, caja.firstChild);
    }
    document.querySelectorAll('img.logo-app').forEach(function (img) {
      if (cfg.logoUrl) img.src = cfg.logoUrl; else img.style.display = 'none';
    });
    ponerIconos(cfg.logoUrl);
    function recorrer(nodo) {
      if (nodo.nodeType === 3) {
        var t = nodo.nodeValue, nuevo = reemplazar(t, pares);
        if (nuevo !== t) nodo.nodeValue = nuevo;
      } else if (nodo.nodeType === 1 && nodo.tagName !== 'SCRIPT' && nodo.tagName !== 'STYLE') {
        for (var c = nodo.firstChild; c; c = c.nextSibling) recorrer(c);
      }
    }
    recorrer(document.body);
    new MutationObserver(function (muts) {
      muts.forEach(function (m) {
        m.addedNodes.forEach(recorrer);
        if (m.type === 'characterData') recorrer(m.target);
      });
    }).observe(document.body, { childList: true, subtree: true, characterData: true });
  }

  // Convierte la imagen elegida en PNG chico (máx. 800 px de ancho).
  function leerLogo(file) {
    return new Promise(function (resolve, reject) {
      var rd = new FileReader();
      rd.onerror = reject;
      rd.onload = function () {
        var img = new Image();
        img.onerror = reject;
        img.onload = function () {
          var escala = Math.min(1, 800 / img.width);
          var c = document.createElement('canvas');
          c.width = Math.round(img.width * escala);
          c.height = Math.round(img.height * escala);
          c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
          resolve(c.toDataURL('image/png'));
        };
        img.src = rd.result;
      };
      rd.readAsDataURL(file);
    });
  }

  function abrirFormulario(cfg, esPrimeraVez) {
    var ov = document.createElement('div');
    ov.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:9999;overflow:auto;padding:16px;font-family:-apple-system,Segoe UI,Roboto,sans-serif';
    var html = '<div style="max-width:460px;margin:20px auto;background:#fff;color:#222;border-radius:12px;padding:20px;box-sizing:border-box">' +
      '<h2 style="margin:0 0 6px;font-size:20px">' + (esPrimeraVez ? 'Configurar el taller' : 'Datos del taller') + '</h2>' +
      '<p style="margin:0 0 14px;color:#666;font-size:14px">' + (esPrimeraVez ? 'Completá los datos. Después los podés cambiar desde el botón "Datos del taller".' : 'Cambiá lo que necesites y guardá.') + '</p>';
    CAMPOS.forEach(function (c) {
      html += '<label style="display:block;margin:10px 0 4px;font-size:14px">' + c[1] + '</label>' +
        '<input data-k="' + c[0] + '" type="' + c[2] + '" value="' + String(cfg[c[0]] || '').replace(/"/g, '&quot;') + '" style="width:100%;box-sizing:border-box;padding:10px;font-size:16px;border:1px solid #bbb;border-radius:8px">';
    });
    html += '<label style="display:block;margin:14px 0 4px;font-size:14px">Logo (PNG o JPG)</label>' +
      '<input id="tb_logo" type="file" accept="image/png,image/jpeg" style="display:block;font-size:15px;margin:4px 0">' +
      (cfg.logoUrl ? '<p style="font-size:13px;color:#666">Ya hay un logo cargado. Si elegís otro, reemplaza al anterior.</p>' : '');
    if (!esPrimeraVez) {
      html += '<label style="display:block;margin:14px 0 4px;font-size:14px">Clave del taller</label>' +
        '<input id="tb_clave" type="password" style="width:100%;box-sizing:border-box;padding:10px;font-size:16px;border:1px solid #bbb;border-radius:8px">';
    }
    html += '<p id="tb_msg" style="color:#c00;font-size:14px;min-height:18px;margin:12px 0 0"></p>' +
      '<div style="display:flex;gap:10px;margin-top:10px">' +
      '<button id="tb_ok" style="flex:1;padding:12px;font-size:16px;border:0;border-radius:8px;background:#e8642c;color:#fff;font-weight:600">Guardar</button>' +
      (esPrimeraVez ? '' : '<button id="tb_cerrar" style="padding:12px;font-size:16px;border:1px solid #bbb;border-radius:8px;background:#fff;color:#222">Cerrar</button>') +
      '</div></div>';
    ov.innerHTML = html;
    document.body.appendChild(ov);

    var cerrar = document.getElementById('tb_cerrar');
    if (cerrar) cerrar.onclick = function () { ov.remove(); };

    document.getElementById('tb_ok').onclick = async function () {
      var msg = document.getElementById('tb_msg');
      var btn = this;
      var datos = {};
      ov.querySelectorAll('input[data-k]').forEach(function (i) { datos[i.getAttribute('data-k')] = i.value.trim(); });
      if (!datos.nombre) { msg.textContent = 'Falta el nombre del taller.'; return; }
      var clave = document.getElementById('tb_clave');
      if (clave) datos.password = clave.value;
      var file = document.getElementById('tb_logo').files[0];
      btn.disabled = true; btn.textContent = 'Guardando...';
      try {
        if (file) datos.logo = await leerLogo(file);
        var r = await fetch(window.APP_CONFIG.API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(Object.assign({ action: 'setConfig' }, datos)) });
        var j = await r.json().catch(function () { return {}; });
        if (!r.ok || !j.ok) throw new Error(j.error || 'No se pudo guardar.');
        location.reload();
      } catch (e) {
        msg.textContent = e.message || 'No se pudo guardar.';
        btn.disabled = false; btn.textContent = 'Guardar';
      }
    };
  }

  // Botón "Datos del taller": va en el menú lateral, debajo de las demás pantallas.
  // Si la página no tiene menú, queda como botón flotante abajo a la izquierda.
  function botonDatos(cfg) {
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'tab-btn';
    b.innerHTML = '<span>Datos del taller</span>';
    b.onclick = function () { abrirFormulario(cfg, false); };
    var menu = document.querySelector('.tab-btn');
    if (menu && menu.parentNode) {
      menu.parentNode.appendChild(b);
    } else {
      b.style.cssText = 'position:fixed;left:10px;bottom:10px;z-index:900;padding:8px 12px;font-size:13px;border:1px solid #bbb;border-radius:8px;background:#fff;color:#333;opacity:.85';
      document.body.appendChild(b);
    }
  }

  fetch(window.APP_CONFIG.API_URL + '?config=1', { cache: 'no-store' })
    .then(function (r) { return r.ok ? r.json() : null; })
    .then(function (j) { return j && j.ok ? j.config : null; })
    .then(function (cfg) {
      if (!cfg) return;
      // La página de estado para clientes (/ver) solo muestra los datos: no tiene configuración.
      if (location.pathname.indexOf('/ver') === 0 || /[?&]page=ver(&|$)/.test(location.search) || /ver\.html$/.test(location.pathname)) {
        if (document.body) aplicar(cfg);
        else document.addEventListener('DOMContentLoaded', function () { aplicar(cfg); });
        return;
      }
      if (!cfg.setupDone) {
        document.addEventListener('DOMContentLoaded', function () { abrirFormulario(cfg, true); });
        if (document.body) abrirFormulario(cfg, true);
        return;
      }
      if (document.body) { aplicar(cfg); botonDatos(cfg); }
      else document.addEventListener('DOMContentLoaded', function () { aplicar(cfg); botonDatos(cfg); });
    })
    .catch(function () {});
})();

</script>
