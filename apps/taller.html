  // Devuelve [fromTs, toTs] según el preset actual.
  function computeRange(){
    const now = new Date();
    const startOfDay = d => new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime();
    const endOfDay = d => startOfDay(d) + 86400000 - 1;
    switch(statsState.preset){
      case 'last7': {
        const to = endOfDay(now);
        const from = startOfDay(new Date(now.getTime() - 6 * 86400000));
        return [from, to];
      }
      case 'thisMonth': {
        const from = new Date(now.getFullYear(), now.getMonth(), 1).getTime();
        return [from, endOfDay(now)];
      }
      case 'lastMonth': {
        const from = new Date(now.getFullYear(), now.getMonth() - 1, 1).getTime();
        const to = new Date(now.getFullYear(), now.getMonth(), 1).getTime() - 1;
        return [from, to];
      }
      case 'custom':
        return [statsState.from, statsState.to];
      case 'last30':
      default: {
        const to = endOfDay(now);
        const from = startOfDay(new Date(now.getTime() - 29 * 86400000));
        return [from, to];
      }
    }
  }

  function labelRange(){
    const [f, t] = computeRange();
    if(!f || !t) return 'Sin rango';
    const fmt = d => new Date(d).toLocaleDateString('es-AR', {day:'2-digit', month:'2-digit', year:'numeric'});
    return fmt(f) + ' a ' + fmt(t);
  }

  function renderStats(){
    const wrap = document.getElementById('statsContent');
    const [fromTs, toTs] = computeRange();

    // Contamos cuántas veces se ENTRÓ a cada estado dentro del rango.
    // Un auto puede entrar 2 o más veces (ej. volver de lavadero a control).
    // Cada entry del historial dentro del rango cuenta una vez.
    const perEstado = {};
    ESTADOS.forEach(e => perEstado[e.id] = { count:0, times: [] });
    allRecords.forEach(r => {
      const hist = r.estadoHistorial || [];
      // También contamos el estado inicial 'ingresado' cuando fue creado —
      // si el createdAt entra en rango.
      const startTs = new Date(r.createdAt || 0).getTime();
      if(startTs >= fromTs && startTs <= toTs){
        // ingresado implicito
        if(perEstado.ingresado){
          perEstado.ingresado.count++;
        }
      }
      hist.forEach((h, i) => {
        if(h.at >= fromTs && h.at <= toTs){
          if(perEstado[h.estado]){
            perEstado[h.estado].count++;
            // Tiempo que estuvo en el estado anterior (from → h.at)
            // Buscamos hacia atrás el momento cuando entró al estado anterior.
            let prevTs;
            if(i === 0) prevTs = startTs;
            else prevTs = hist[i-1].at;
            const dur = h.at - prevTs;
            const estAnt = i === 0 ? 'ingresado' : hist[i-1].estado;
            if(perEstado[estAnt] && dur > 0){
              perEstado[estAnt].times.push(dur);
            }
          }
        }
      });
    });

    // Auto totals
    const activos = allRecords.filter(r => r.estado !== 'entregado').length;
    const entregadosEnRango = allRecords.filter(r => {
      const hist = r.estadoHistorial || [];
      const ent = hist.filter(h => h.estado === 'entregado').pop();
      return ent && ent.at >= fromTs && ent.at <= toTs;
    }).length;
    const ingresadosEnRango = allRecords.filter(r => {
      const t = new Date(r.createdAt || 0).getTime();
      return t >= fromTs && t <= toTs;
    }).length;

    // ---------- Sección lavadero ----------
    // Autos que fueron a lavadero DENTRO del rango. Extraemos la entry del
    // historial que cumpla, y calculamos duración en lavadero (si ya salió).
    const lavaderoEntries = [];
    allRecords.forEach(r => {
      const hist = r.estadoHistorial || [];
      hist.forEach((h, i) => {
        if(h.estado !== 'lavadero') return;
        if(h.at < fromTs || h.at > toTs) return;
        const salidaEntry = hist[i+1]; // siguiente cambio de estado = salió del lavadero
        const salidaTs = salidaEntry ? salidaEntry.at : (r.estado === 'lavadero' ? null : null);
        lavaderoEntries.push({
          rec: r, at: h.at, salidaAt: salidaTs, nota: h.nota || '',
          stillIn: !salidaEntry && r.estado === 'lavadero'
        });
      });
    });
    // Más nuevo arriba
    lavaderoEntries.sort((a, b) => b.at - a.at);

    // Semanal para el gráfico del lavadero (últimas 6 semanas)
    const weeks = buildWeeklyLavadero();

    // ---------- Render ----------
    wrap.innerHTML =
      // Filtros
      '<div class="stats-filters">' +
        '<div class="field"><label>Rango</label>' +
          '<div class="presets" id="statsPresets">' +
            '<button data-p="last7" class="' + (statsState.preset==='last7'?'active':'') + '">Últimos 7 días</button>' +
            '<button data-p="last30" class="' + (statsState.preset==='last30'?'active':'') + '">Últimos 30</button>' +
            '<button data-p="thisMonth" class="' + (statsState.preset==='thisMonth'?'active':'') + '">Este mes</button>' +
            '<button data-p="lastMonth" class="' + (statsState.preset==='lastMonth'?'active':'') + '">Mes anterior</button>' +
          '</div>' +
        '</div>' +
        '<div style="flex-basis:100%; font-size:12.5px; color:var(--text-dim); font-family:Space Mono,monospace;">' + escapeHtml(labelRange()) + '</div>' +
        '<button class="csv-btn" id="btnDownloadCsv">' + uiIcon('download','inline-icon') + ' Descargar Excel</button>' +
      '</div>' +

      // KPIs generales
      '<div class="stats-summary">' +
        statCard('En taller ahora', activos, 'no entregados', 'accent') +
        statCard('Ingresos en el rango', ingresadosEnRango, 'autos nuevos', '') +
        statCard('Entregas en el rango', entregadosEnRango, 'autos finalizados', '') +
        statCard('Pasaron por lavadero', lavaderoEntries.length, 'en el rango', '') +
      '</div>' +

      // Tabla por estado
      '<div class="section-label">Movimientos por estado</div>' +
      '<div class="stats-table"><table>' +
        '<thead><tr>' +
          '<th>Estado</th>' +
          '<th class="num">Veces que se entró</th>' +
          '<th class="num">Tiempo promedio</th>' +
          '<th class="num">Tiempo máximo</th>' +
        '</tr></thead><tbody>' +
        ESTADOS.map(e => {
          const s = perEstado[e.id];
          const times = s.times;
          const avg = times.length ? formatDur(times.reduce((a,b)=>a+b,0) / times.length) : '—';
          const max = times.length ? formatDur(Math.max(...times)) : '—';
          return '<tr>' +
            '<td><div class="estado-cell"><span class="dot" style="background:' + colorForEstado(e.id) + '"></span>' + escapeHtml(e.label) + '</div></td>' +
            '<td class="num">' + s.count + '</td>' +
            '<td class="num">' + avg + '</td>' +
            '<td class="num">' + max + '</td>' +
          '</tr>';
        }).join('') +
      '</tbody></table></div>' +

      // Sección lavadero
      '<div class="lavadero-section">' +
        '<h3>' + uiIcon('shower','inline-icon') + ' Detalle de lavadero</h3>' +
        '<div class="sub">Para saldar cuentas con el lavadero externo. Se lista cada auto que pasó por lavadero en el rango, con la fecha y la nota (qué quedó en el auto).</div>' +

        (weeks.length ? (
          '<div style="font-size:12.5px; color:var(--text-dim); margin-bottom:4px;">Autos que entraron al lavadero por semana (últimas 6):</div>' +
          '<div class="weekly-chart"><div class="weekly-bars">' +
            weeks.map(w => {
              const max = Math.max(1, ...weeks.map(x=>x.count));
              const h = (w.count / max) * 90 + 4;
              return '<div class="weekly-bar" style="height:' + h + 'px" title="' + w.label + ': ' + w.count + '">' +
                (w.count > 0 ? '<span class="count">' + w.count + '</span>' : '') +
                '<span class="lbl">' + w.label + '</span>' +
              '</div>';
            }).join('') +
          '</div></div>'
        ) : '') +

        '<div class="lavadero-list" style="margin-top:14px;">' +
          (lavaderoEntries.length === 0
            ? '<div class="empty-state">Sin autos en lavadero en este rango.</div>'
            : lavaderoEntries.map(le => {
                const v = le.rec.vehiculo || {}; const c = le.rec.cliente || {};
                let dur = '';
                if(le.stillIn){
                  dur = 'todavía en lavadero (' + Math.floor((Date.now() - le.at) / 86400000) + 'd)';
                } else if(le.salidaAt){
                  const d = Math.floor((le.salidaAt - le.at) / 86400000);
                  dur = 'estuvo ' + d + 'd';
                }
                return '<div class="lavadero-item">' +
                  '<span class="plate">' + escapeHtml(v.patente || '—') + '</span>' +
                  '<div class="info">' +
                    escapeHtml(((v.marca||'') + ' ' + (v.modelo||'')).trim() || '—') +
                    '<div class="cli">' + escapeHtml(c.nombre || '') + '</div>' +
                  '</div>' +
                  '<div class="fecha">' +
                    new Date(le.at).toLocaleDateString('es-AR', {day:'2-digit', month:'2-digit', year:'2-digit'}) +
                    (dur ? '<br>' + dur : '') +
                  '</div>' +
                  (le.nota ? '<div class="nota">' + uiIcon('note','inline-icon') + ' ' + escapeHtml(le.nota) + '</div>' : '') +
                '</div>';
              }).join('')) +
        '</div>' +
      '</div>';

    // Handlers de presets
    wrap.querySelectorAll('#statsPresets button').forEach(b => {
      b.addEventListener('click', ()=>{
        statsState.preset = b.dataset.p;
        renderStats();
      });
    });
    // CSV download
    document.getElementById('btnDownloadCsv').addEventListener('click', ()=>{
      downloadStatsCsv(perEstado, lavaderoEntries);
    });
  }

  function statCard(lbl, num, sub, cls){
    return '<div class="stat-card">' +
      '<div class="lbl">' + escapeHtml(lbl) + '</div>' +
      '<div class="num ' + (cls||'') + '">' + escapeHtml(String(num)) + '</div>' +
      '<div style="font-size:11.5px; color:var(--text-dim);">' + escapeHtml(sub) + '</div>' +
    '</div>';
  }

  function formatDur(ms){
    if(!ms) return '—';
    const hours = ms / 3600000;
    if(hours < 24) return hours.toFixed(1) + 'h';
    return (hours / 24).toFixed(1) + 'd';
  }

  function buildWeeklyLavadero(){
    // Últimas 6 semanas (calendario, lunes a domingo). Cuenta cuántas entradas a lavadero hubo por semana.
    const weeks = [];
    const now = new Date();
    // Encuentro el lunes de esta semana
    const dow = (now.getDay() + 6) % 7; // 0=lunes
    const thisMon = new Date(now.getFullYear(), now.getMonth(), now.getDate() - dow);
    for(let w = 5; w >= 0; w--){
      const monday = new Date(thisMon.getTime() - w * 7 * 86400000);
      const nextMon = new Date(monday.getTime() + 7 * 86400000);
      const count = allRecords.reduce((acc, r) => {
        const hist = r.estadoHistorial || [];
        hist.forEach(h => {
          if(h.estado === 'lavadero' && h.at >= monday.getTime() && h.at < nextMon.getTime()) acc++;
        });
        return acc;
      }, 0);
      weeks.push({
        label: monday.getDate() + '/' + (monday.getMonth() + 1),
        count
      });
    }
    return weeks;
  }

  function downloadStatsCsv(perEstado, lavaderoEntries){
    // 2 secciones en un solo CSV: resumen por estado + detalle lavadero.
    const lines = [];
    lines.push('# Reporte Taller — ' + labelRange());
    lines.push('# Generado: ' + new Date().toLocaleString('es-AR'));
    lines.push('');
    lines.push('## Resumen por estado');
    lines.push('Estado,Veces que se entró,Tiempo promedio (h),Tiempo máximo (h)');
    ESTADOS.forEach(e => {
      const s = perEstado[e.id];
      const times = s.times;
      const avg = times.length ? (times.reduce((a,b)=>a+b,0) / times.length / 3600000).toFixed(1) : '';
      const max = times.length ? (Math.max(...times) / 3600000).toFixed(1) : '';
      lines.push([e.label, s.count, avg, max].map(csvCell).join(','));
    });
    lines.push('');
    lines.push('## Detalle lavadero');
    lines.push('Patente,Cliente,Marca/Modelo,Fecha entrada,Fecha salida,Duración (días),Nota');
    lavaderoEntries.forEach(le => {
      const v = le.rec.vehiculo || {}; const c = le.rec.cliente || {};
      const dur = le.salidaAt ? Math.floor((le.salidaAt - le.at) / 86400000) : (le.stillIn ? Math.floor((Date.now() - le.at) / 86400000) + ' (aún)' : '');
      lines.push([
        v.patente || '',
        c.nombre || '',
        ((v.marca||'') + ' ' + (v.modelo||'')).trim(),
        new Date(le.at).toLocaleDateString('es-AR'),
        le.salidaAt ? new Date(le.salidaAt).toLocaleDateString('es-AR') : '',
        dur,
        le.nota || ''
      ].map(csvCell).join(','));
    });
    // Descarga
    const bom = '﻿'; // para que Excel lo abra bien en Windows con acentos
    const blob = new Blob([bom + lines.join('\n')], { type:'text/csv;charset=utf-8;' });
    const a = document.createElement('a');
    const url = URL.createObjectURL(blob);
    a.href = url;
    a.download = 'reporte-taller-' + new Date().toISOString().slice(0,10) + '.csv';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }
  function csvCell(v){
    const s = String(v == null ? '' : v);
    if(s.includes(',') || s.includes('"') || s.includes('\n')) return '"' + s.replace(/"/g, '""') + '"';
    return s;
  }

  // ---------- refresh ----------
  document.getElementById('btnRefresh').addEventListener('click', ()=>{
    loadRecords();
    showToast('Actualizado');
  });


  // ---------- flechas del tablero (navegar columnas sin arrastrar) ----------
  // Se instala UNA sola vez: #board nunca se destruye (renderBoard solo
  // reemplaza su innerHTML), así que no hace falta reinstalar esto por render.
  (function(){
    const boardEl = document.getElementById('board');
    const btnL = document.getElementById('boardNavLeft');
    const btnR = document.getElementById('boardNavRight');
    if(!boardEl || !btnL || !btnR) return;

    function colStep(){
      const col = boardEl.querySelector('.col');
      // Gap real leído del CSS — antes estaba hardcodeado en 14, pero en
      // mobile el gap es otro (10 en la media query actual), así que las
      // flechas se quedaban cortas o se pasaban de columna en el celular.
      const styles = getComputedStyle(boardEl);
      const gap = parseFloat(styles.columnGap || styles.gap) || 0;
      return col ? (col.getBoundingClientRect().width + gap) : 280;
    }

    // Global porque renderBoard() la llama al terminar de reconstruir
    // columnas (puede cambiar scrollWidth, así que hay que re-evaluar
    // disabled ahí también, no solo en scroll/resize).
    window.updateBoardNavState = function(){
      const max = Math.max(0, boardEl.scrollWidth - boardEl.clientWidth);
      btnL.disabled = boardEl.scrollLeft <= 2;
      btnR.disabled = boardEl.scrollLeft >= max - 2;
    };

    btnL.addEventListener('click', ()=>{ boardEl.scrollBy({left: -colStep(), behavior:'smooth'}); });
    btnR.addEventListener('click', ()=>{ boardEl.scrollBy({left: colStep(), behavior:'smooth'}); });
    boardEl.addEventListener('scroll', updateBoardNavState, {passive:true});
    window.addEventListener('resize', updateBoardNavState);
    updateBoardNavState();
  })();

  // ---------- pan horizontal del tablero (agarrar fondo/encabezado y arrastrar) ----------
  // Instalado UNA sola vez fuera de renderBoard() (el nodo #board persiste
  // entre renders). El navegador YA tiene un scroll horizontal nativo
  // excelente en #board (overflow-x:auto + -webkit-overflow-scrolling:touch),
  // así que en touch (dedo en celular/tablet) no hacemos nada acá: dejamos
  // que el scroll nativo del navegador se encargue solo, sin preventDefault
  // ni pointer capture de por medio. Este bloque de JS solo agrega
  // "arrastrar para scrollear" con mouse/lápiz (drag-to-scroll), algo que el
  // navegador no da gratis con mouse. Si el gesto arranca sobre una .card (o
  // un control de formulario) tampoco hacemos nada acá, eso lo maneja
  // SortableJS (arrastrar fondo = navegar tablero, arrastrar ficha = cambiar
  // estado — son cosas distintas).
  (function(){
    const board = document.getElementById('board');
    if(!board) return;

    let panning = false;
    let pointerId = null;
    let startX = 0, startY = 0;
    let startScrollLeft = 0;
    let horizontalDrag = false;

    board.addEventListener('pointerdown', function(e){
      if(e.target.closest('.card')) return;
      if(e.target.closest('button, a, input, select, textarea, label')) return;
      // Touch: no interceptamos nada, scroll horizontal 100% nativo.
      if(e.pointerType === 'touch') return;
      if(e.pointerType === 'mouse' && e.button !== 0) return;

      panning = true;
      pointerId = e.pointerId;
      startX = e.clientX;
      startY = e.clientY;
      startScrollLeft = board.scrollLeft;
      horizontalDrag = false;
      try{ board.setPointerCapture(pointerId); }catch(err){}
    });

    board.addEventListener('pointermove', function(e){
      if(!panning) return;
      const dx = e.clientX - startX;
      const dy = e.clientY - startY;

      if(!horizontalDrag){
        // Zona muerta: un toque/click chiquito no debe iniciar pan.
        if(Math.abs(dx) < 6 && Math.abs(dy) < 6) return;
        // Gesto más vertical que horizontal → es un scroll de página normal,
        // no tocamos nada (soltamos el pan sin más).
        if(Math.abs(dy) > Math.abs(dx)){ stopPan(); return; }
        horizontalDrag = true;
        board.classList.add('board-panning');
      }

      board.scrollLeft = startScrollLeft - dx;
      if(e.cancelable) e.preventDefault();
    }, {passive:false});

    function stopPan(){
      if(!panning) return;
      panning = false;
      board.classList.remove('board-panning');
      try{
        if(pointerId !== null && board.hasPointerCapture(pointerId)){
          board.releasePointerCapture(pointerId);
        }
      }catch(err){}
      pointerId = null;
      horizontalDrag = false;
    }

    board.addEventListener('pointerup', stopPan);
    board.addEventListener('pointercancel', stopPan);
    board.addEventListener('lostpointercapture', stopPan);
  })();
  // Auto-refresh cada 45s si la pestaña está visible
  setInterval(()=>{
    if(document.visibilityState === 'visible') loadRecords();
  }, 45000);

  // ---------- init ----------
  refreshUnlockBtn();
  loadRecords();

})();
</script>
