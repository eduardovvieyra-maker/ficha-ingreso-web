<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
<title>Estado de tu vehículo · Mi Taller</title>
<!-- theme-color = fondo del header para evitar el blur del status bar iOS. -->
<meta name="theme-color" content="#1e2223">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Work+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#191c1d; --bg-panel:#222627; --bg-raised:#2b3031;
    --text:#EDEAE0; --text-dim:#9AA0A0;
    --accent:#FB5A24; --accent-2:#5C9098;
    --ok:#5CB85C;
    --border:#3a3f40; --radius:12px;
  }
  *{box-sizing:border-box;}
  html{background:#1e2223;}
  body{margin:0; padding:0; background:var(--bg); color:var(--text); font-family:'Work Sans',system-ui,sans-serif;}
  /* Overlay sólido a z:200 sobre el notch. */
  body::before{
    content:''; position:fixed; top:0; left:0; right:0;
    height:env(safe-area-inset-top, 0px);
    background:#1e2223; z-index:200; pointer-events:none;
  }

  header{
    background:linear-gradient(135deg, #1e2223 0%, #2d3134 100%);
    padding:24px 20px 32px 20px; text-align:center; border-bottom:3px solid var(--accent);
  }
  header .tag{background:var(--accent); color:#1b1b1b; font-weight:700; font-size:12px; padding:3px 10px; border-radius:5px; font-family:'Space Mono',monospace; letter-spacing:.05em; display:inline-block; margin-bottom:8px;}
  header h1{font-size:20px; margin:0; font-weight:600;}
  header .sub{font-size:13px; color:var(--text-dim); margin-top:4px; font-family:'Space Mono',monospace;}

  main{padding:20px 16px 60px 16px; max-width:560px; margin:0 auto;}

  .veh-card{
    background:var(--bg-panel); border:1px solid var(--border); border-radius:16px;
    padding:20px; margin-bottom:20px; text-align:center;
  }
  .veh-card .plate{
    display:inline-block; background:#fff; color:#000;
    font-family:'Space Mono',monospace; font-weight:700; font-size:28px;
    padding:8px 20px; border-radius:6px; letter-spacing:.05em;
    box-shadow:0 3px 8px rgba(0,0,0,.4);
    margin-bottom:14px;
  }
  .veh-card .veh{font-size:18px; font-weight:600; margin-bottom:4px;}
  .veh-card .nombre{font-size:14.5px; color:var(--text-dim);}
  .veh-card .ingreso{font-size:12.5px; color:var(--text-dim); font-family:'Space Mono',monospace; margin-top:8px;}

  .estado-actual{
    background:var(--bg-panel); border-radius:16px; padding:24px 20px;
    text-align:center; margin-bottom:20px;
    border:2px solid var(--accent);
  }
  .estado-actual .lbl{font-size:12px; color:var(--text-dim); text-transform:uppercase; letter-spacing:.1em; margin-bottom:8px; font-family:'Space Mono',monospace;}
  .estado-actual .estado{font-size:28px; font-weight:800; color:var(--accent); margin-bottom:6px; display:flex; align-items:center; justify-content:center; gap:12px;}
  .estado-actual .estado .icon{font-size:32px;}
  .estado-actual .desde{font-size:13px; color:var(--text-dim); font-family:'Space Mono',monospace;}

  /* Progreso visual: barra con 8 pasos */
  .stepper{
    display:flex; align-items:center; justify-content:space-between; gap:6px;
    padding:20px 4px; margin-bottom:20px; overflow-x:auto;
  }
  .stepper .step{
    flex:1; min-width:38px;
    text-align:center;
    display:flex; flex-direction:column; align-items:center; gap:4px;
    position:relative;
  }
  .stepper .step .dot{
    width:32px; height:32px; border-radius:50%;
    background:var(--bg-raised); border:2px solid var(--border);
    display:flex; align-items:center; justify-content:center;
    font-size:14px; font-weight:700; color:var(--text-dim);
  }
  .stepper .step.done .dot{background:var(--ok); border-color:var(--ok); color:#fff;}
  .stepper .step.current .dot{background:var(--accent); border-color:var(--accent); color:#1b1b1b; box-shadow:0 0 0 4px rgba(251,90,36,.2);}
  .stepper .step .lbl{font-size:9.5px; color:var(--text-dim); font-family:'Space Mono',monospace; text-transform:uppercase;}
  .stepper .step.current .lbl, .stepper .step.done .lbl{color:var(--text);}
  .stepper .step::after{
    content:''; position:absolute; top:15px; right:-50%;
    width:100%; height:2px; background:var(--border); z-index:-1;
  }
  .stepper .step:last-child::after{display:none;}
  .stepper .step.done::after{background:var(--ok);}

  .section-label{
    font-family:'Space Mono',monospace; font-size:12px; text-transform:uppercase;
    letter-spacing:.08em; color:var(--accent-2); margin:24px 0 10px 0;
    display:flex; align-items:center; gap:8px;
  }
  .section-label::after{content:''; flex:1; height:1px; background:var(--border);}

  /* Adjuntos posteriores */
  .att-item{
    background:var(--bg-panel); border:1px solid var(--border); border-radius:12px;
    padding:10px; margin-bottom:10px; display:flex; gap:12px;
  }
  .att-item .thumb{
    flex:none; width:100px; height:100px; background:#000;
    border-radius:8px; overflow:hidden; position:relative;
  }
  .att-item .thumb img, .att-item .thumb video{width:100%; height:100%; object-fit:cover;}
  .att-item .thumb .play-icon{position:absolute; inset:0; background:rgba(0,0,0,.4); display:flex; align-items:center; justify-content:center; color:#fff; font-size:32px;}
  .att-item .info{flex:1; display:flex; flex-direction:column;}
  .att-item .caption{font-size:14px; margin-bottom:6px;}
  .att-item .caption.empty{color:var(--text-dim); font-style:italic;}
  .att-item .date{font-size:11.5px; color:var(--text-dim); font-family:'Space Mono',monospace; margin-top:auto;}

  .empty{
    background:var(--bg-panel); border:1px dashed var(--border); border-radius:12px;
    padding:24px; text-align:center; color:var(--text-dim); font-size:13px;
  }

  /* Historial */
  .hist{
    background:var(--bg-panel); border-radius:12px; padding:14px 16px;
    font-family:'Space Mono',monospace; font-size:13px;
  }
  .hist .h{display:flex; justify-content:space-between; padding:6px 0; border-bottom:1px dashed var(--border);}
  .hist .h:last-child{border-bottom:none;}
  .hist .h .e{color:var(--accent);}
  .hist .h .t{color:var(--text-dim);}

  .footer{text-align:center; margin-top:32px; padding:20px; color:var(--text-dim); font-size:12px;}
  .footer .wa-btn{
    display:inline-flex; align-items:center; gap:8px;
    background:#25D366; color:#fff; padding:12px 22px; border-radius:10px;
    text-decoration:none; font-weight:700; margin-top:12px;
  }

  .error-state{background:var(--bg-panel); border-radius:12px; padding:40px 20px; text-align:center; color:var(--text-dim);}
  .error-state h2{color:var(--text); margin-top:0;}

  /* Photo/video viewer */
  .viewer{position:fixed; inset:0; background:#000; z-index:100; display:none; align-items:center; justify-content:center; padding:20px;}
  .viewer.open{display:flex;}
  .viewer img, .viewer video{max-width:100%; max-height:100%;}
  .viewer .close{position:absolute; top:16px; right:16px; background:rgba(0,0,0,.5); color:#fff; border:none; width:44px; height:44px; border-radius:50%; font-size:24px; cursor:pointer;}
</style>
<script>window.APP_CONFIG={API_URL:'<?!= apiUrl ?>'};</script>
<?!= include('puente') ?>
<?!= include('branding') ?>
</head>
<body>

<header>
  <div class="tag">MI TALLER · TALLER CITROËN</div>
  <h1>Estado de tu vehículo</h1>
  <div class="sub">Seguimiento en tiempo real</div>
</header>

<main id="main">
  <div class="empty" id="loading">Cargando información de tu vehículo...</div>
</main>

<div class="viewer" id="viewer">
  <button class="close" id="viewerClose">×</button>
  <div id="viewerContent"></div>
</div>

<script>
(function(){
  const ESTADOS = [
    { id:'ingresado',          label:'Ingresado',           icon:'📥', desc:'Tu vehículo llegó al taller y está registrado.' },
    { id:'diagnostico',        label:'En diagnóstico',      icon:'🔍', desc:'Estamos revisando qué necesita.' },
    { id:'presupuestado',      label:'Presupuestado',       icon:'📋', desc:'Preparamos el presupuesto — te avisamos.' },
    { id:'aprobado',           label:'Aprobado',            icon:'✅', desc:'Trabajo aprobado — coordinando el arranque.' },
    { id:'esperando_repuesto', label:'Esperando repuesto',  icon:'📦', desc:'Estamos esperando que llegue el repuesto para arrancar la reparación.' },
    { id:'reparacion',         label:'En reparación',       icon:'🔧', desc:'Nuestros técnicos están trabajando en él.' },
    { id:'control',            label:'Control final',       icon:'🔎', desc:'Chequeo final antes de entregarlo.' },
    { id:'lavadero',           label:'En lavadero',         icon:'🚿', desc:'Está siendo lavado antes de la entrega.' },
    { id:'listo',              label:'Listo para retirar',  icon:'🎉', desc:'Podés pasar a buscarlo cuando quieras.' },
    { id:'entregado',          label:'Entregado',           icon:'🚗', desc:'Muchas gracias por confiar en Mi Taller.' }
  ];
  const ESTADO_MAP = Object.fromEntries(ESTADOS.map(e => [e.id, e]));

  function escapeHtml(s){ return String(s||'').replace(/[&<>"']/g, c=>({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  function fmtDateTime(ts){ if(!ts) return '—'; return new Date(ts).toLocaleString('es-AR', {day:'2-digit', month:'2-digit', year:'2-digit', hour:'2-digit', minute:'2-digit'}); }
  function fmtDate(ts){ if(!ts) return '—'; return new Date(ts).toLocaleDateString('es-AR', {day:'2-digit', month:'2-digit', year:'2-digit'}); }
  function daysSince(ts){ if(!ts) return 0; return Math.floor((Date.now() - ts) / 86400000); }

  function getToken(){
    const p = new URLSearchParams(location.search);
    return p.get('t') || p.get('token') || '';
  }

  async function load(){
    const tok = getToken();
    if(!tok){
      showError('Link inválido', 'El link que abriste no tiene el código de tu vehículo. Contactá al taller.');
      return;
    }
    try{
      const res = await fetch(window.APP_CONFIG.API_URL + '?token=' + encodeURIComponent(tok) + '&_=' + Date.now(), { cache:'no-store' });
      const j = await res.json();
      if(!j.ok || !j.record){
        showError('Vehículo no encontrado', 'El link puede estar vencido o mal escrito. Contactá al taller para que te reenvíen el link.');
        return;
      }
      render(j.record);
    }catch(err){
      showError('No pudimos cargar la info', 'Revisá que tengas señal de internet y volvé a intentar. Si sigue fallando, contactá al taller.');
    }
  }

  function showError(title, msg){
    document.getElementById('main').innerHTML =
      '<div class="error-state">' +
        '<h2>' + escapeHtml(title) + '</h2>' +
        '<p>' + escapeHtml(msg) + '</p>' +
      '</div>';
  }

  function render(rec){
    const v = rec.vehiculo || {}; const c = rec.cliente || {};
    const es = rec.estado || 'ingresado';
    const estadoInfo = ESTADO_MAP[es] || ESTADOS[0];
    const hist = rec.estadoHistorial || [];
    const lastChange = hist.length ? hist[hist.length - 1].at : (rec.createdAt ? new Date(rec.createdAt).getTime() : Date.now());
    const diasEstado = daysSince(lastChange);
    const attachments = rec.attachments || [];
    const currentIdx = ESTADOS.findIndex(e => e.id === es);

    // Stepper
    const stepperHtml = ESTADOS.map((e, i) => {
      let cls = '';
      if(i < currentIdx) cls = 'done';
      else if(i === currentIdx) cls = 'current';
      return '<div class="step ' + cls + '">' +
        '<div class="dot">' + (i < currentIdx ? '✓' : (i+1)) + '</div>' +
        '<div class="lbl">' + escapeHtml(e.label.split(' ')[0]) + '</div>' +
      '</div>';
    }).join('');

    // Attachments (fotos y videos posteriores compartidos con el cliente)
    const attHtml = attachments.length
      ? attachments.slice().sort((a,b)=> (b.createdAt||0) - (a.createdAt||0)).map(a => {
          const isVideo = a.kind === 'video';
          const thumb = isVideo
            ? '<video src="' + escapeHtml(a.url) + '" preload="metadata" muted playsinline></video><div class="play-icon">▶</div>'
            : '<img src="' + escapeHtml(a.url) + '" loading="lazy">';
          return '<div class="att-item" data-url="' + escapeHtml(a.url) + '" data-kind="' + (isVideo?'video':'photo') + '">' +
            '<div class="thumb">' + thumb + '</div>' +
            '<div class="info">' +
              '<div class="caption' + (a.caption ? '' : ' empty') + '">' + escapeHtml(a.caption || '(sin descripción)') + '</div>' +
              '<div class="date">' + fmtDateTime(a.createdAt) + '</div>' +
            '</div>' +
          '</div>';
        }).join('')
      : '<div class="empty">Todavía no hay fotos o videos nuevos. Cuando el taller registre algo, va a aparecer acá.</div>';

    // Historial de cambios de estado (para el cliente, resumido)
    const histCli = hist.slice().reverse();
    const histHtml = histCli.length
      ? '<div class="hist">' + histCli.map(h =>
          '<div class="h"><span class="e">' + escapeHtml(ESTADO_MAP[h.estado]?.label || h.estado) + '</span><span class="t">' + fmtDate(h.at) + '</span></div>'
        ).join('') + '</div>'
      : '<div class="empty">Sin cambios registrados todavía.</div>';

    document.getElementById('main').innerHTML =
      // Vehículo
      '<div class="veh-card">' +
        '<div class="plate">' + escapeHtml(v.patente || '—') + '</div>' +
        '<div class="veh">' + escapeHtml(((v.marca||'') + ' ' + (v.modelo||'') + ' ' + (v.anio||'')).trim() || '—') + '</div>' +
        '<div class="nombre">' + escapeHtml(c.nombre || '') + '</div>' +
        (rec.createdAt ? '<div class="ingreso">Ingreso: ' + fmtDate(rec.createdAt) + '</div>' : '') +
      '</div>' +

      // Estado actual grande
      '<div class="estado-actual">' +
        '<div class="lbl">Estado actual</div>' +
        '<div class="estado"><span class="icon">' + estadoInfo.icon + '</span> ' + escapeHtml(estadoInfo.label) + '</div>' +
        '<div class="desde">' + escapeHtml(estadoInfo.desc) + '</div>' +
        (diasEstado > 0 ? '<div class="desde" style="margin-top:6px;">En este estado hace ' + diasEstado + ' día' + (diasEstado===1?'':'s') + '</div>' : '') +
      '</div>' +

      // Stepper
      '<div class="stepper">' + stepperHtml + '</div>' +

      // Adjuntos (fotos + videos)
      '<div class="section-label">Fotos y videos del taller</div>' +
      attHtml +

      // Historial resumido
      '<div class="section-label">Historial de estados</div>' +
      histHtml +

      // Footer con WhatsApp al taller
      '<div class="footer">' +
        '<div>Mi Taller · Concesionario Oficial Citroën</div>' +
        '<div style="margin-top:4px;">Mi Ciudad, Mi Provincia</div>' +
      '</div>';

    // Handlers para abrir foto/video en pantalla completa
    document.querySelectorAll('.att-item').forEach(item => {
      item.addEventListener('click', ()=>{
        const url = item.dataset.url;
        const kind = item.dataset.kind;
        const v = document.getElementById('viewer');
        const c = document.getElementById('viewerContent');
        if(kind === 'video'){
          c.innerHTML = '<video src="' + escapeHtml(url) + '" controls autoplay style="max-width:100%; max-height:100%;"></video>';
        } else {
          c.innerHTML = '<img src="' + escapeHtml(url) + '">';
        }
        v.classList.add('open');
      });
    });
  }

  document.getElementById('viewerClose').addEventListener('click', ()=>{
    document.getElementById('viewer').classList.remove('open');
    document.getElementById('viewerContent').innerHTML = '';
  });
  document.getElementById('viewer').addEventListener('click', (e)=>{
    if(e.target.id === 'viewer'){
      document.getElementById('viewer').classList.remove('open');
      document.getElementById('viewerContent').innerHTML = '';
    }
  });

  // Auto-refresh cada 60s
  setInterval(load, 60000);
  load();
})();
</script>

</body>
</html>
